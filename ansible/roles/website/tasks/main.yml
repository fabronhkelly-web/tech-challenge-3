---
- name: Deploy Hello World page
  ansible.builtin.template:
    src: index.html.j2
    dest: "{{ website_root }}/index.html"
    owner: www-data
    group: www-data
    mode: "0644"

- name: Apply pending Nginx changes before testing
  ansible.builtin.meta: flush_handlers

- name: Verify the page is served locally
  ansible.builtin.uri:
    url: http://127.0.0.1/
    return_content: true
  register: website_check
  failed_when: >
    website_check.status != 200 or
    'Hello, World!' not in website_check.content
  retries: 5
  delay: 3
  until: website_check.status == 200
